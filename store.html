        }
        .gallery{
            border: 3px solid black;
            display: flex;

            gap: 20px;
            background-color: lightgray;
            margin: 20px;
            padding: 20px;

        }
        .gallery-container{
            background-color: lightgray;
            border: 3px solid black;
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
        }
        .gallery-item{
            text-align: center;
        }
        .gallery-item img{
            width: 350px;
            height: 230px;
            object-fit: center;
            border: 3px solid lightgray;
            border-radius: 10px;
        }
        .gallery-item img:hover{
            transform: scale(1.05);
            transition: 0.3s;
        }
        .gallery-item p{
            color: lightgrey;
            font-weight: bold;
        }
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: lightgray;
        }
        li {
            float: left;
            width: 25%;
        }
        li a {
            display: block;
            color: rgb(250, 241, 241);
            text-align: center;
            padding: 16px;
            text-decoration: none;
        }
        .form {
            float: right;
        }
    </style>
